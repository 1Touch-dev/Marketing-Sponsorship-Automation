name: CI

on:
  pull_request:
  push:
    branches: [redesign-tasks-yash]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      AWS_ACCESS_KEY_ID: ci
      AWS_SECRET_ACCESS_KEY: ci
      BEDROCK_MODEL_ID: ci
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci
      SUPABASE_SERVICE_ROLE_KEY: ci
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (known failure on main line, reported but not blocking)
        run: npm run test:jersey-pipeline
        continue-on-error: true
      - name: Production build
        run: npm run build
      - name: Confirm build artifact
        run: test -f .next/BUILD_ID
